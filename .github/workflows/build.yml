name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew build --no-daemon

      - name: Run in-game tests (Create + Mekanism)
        run: ./gradlew runGameTestServer --no-daemon

      # Downloadable from the workflow run's "Artifacts" section
      - uses: actions/upload-artifact@v4
        with:
          name: mekwasher-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Also keep an always-up-to-date "latest" release with only the newest jar attached (main only).
      # Recreated each time so the tag points at the new commit and old jars don't pile up.
      - name: Remove previous latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Automatically built from ${{ github.sha }}. Drop the jar into mods/ on the server and all clients (requires Create and Mekanism)."
          files: build/libs/*.jar
