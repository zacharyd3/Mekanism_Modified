plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Create and Mekanism are resolved from Modrinth's maven (compile-time only; the real jars come from the modpack)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Headless automated check: ./gradlew runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

dependencies {
    // Only compiled against: Create must be installed on the server/client at runtime.
    compileOnly "maven.modrinth:create:${create_version}"
    // Built on Mekanism's machine framework (GUI, side config, upgrades), so it compiles against the full Mekanism jar.
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"

    // Dev runs only (runClient / runServer / runGameTestServer) - not bundled
    localRuntime "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:mekanism:${mekanism_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The game test (dev-only automated check) is never shipped in the mod jar
tasks.named('jar') {
    exclude 'mekwasher/gametest/**'
    exclude 'data/mekwasher/structure/empty.nbt'
}
